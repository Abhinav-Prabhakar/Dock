<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOVA ’25 — Attendee Badge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="stage" id="stage">

  <!-- ambient scene -->
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grid"></div>
  <div class="beam"></div>
  <div class="watermark">NOVA&nbsp;’25</div>
  <div class="dust" id="dust"></div>

  <!-- lanyard -->
  <svg class="lanyard" id="lanyardSvg">
    <defs>
      <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#171d33"/>
        <stop offset=".5"  stop-color="#40538c"/>
        <stop offset="1"   stop-color="#171d33"/>
      </linearGradient>
    </defs>
    <path id="strapPath"  class="strap"  d=""/>
    <path id="stitchPath" class="stitch" d=""/>
    <text class="strap-text">
      <textPath href="#strapPath" startOffset="10">NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA&#160;&#160;✦&#160;&#160;NOVA</textPath>
    </text>
  </svg>

  <!-- ceiling mount -->
  <div class="anchor" id="anchor">
    <div class="mount"><i></i><i></i></div>
    <div class="ring"></div>
  </div>

  <!-- badge (transformed by physics) -->
  <div id="badge">
    <div class="clip"><i></i><b></b></div>
    <div class="card">
      <div class="card-inner" id="cardInner">
        <div class="slot"></div>

        <header class="top">
          <span class="logo">◆</span>
          <span class="conf">NOVA<b>CONF</b></span>
          <span class="year">’25</span>
        </header>

        <div class="status-row">
          <span class="status">ATTENDEE</span>
          <span class="wave">≋</span>
        </div>

        <div class="photo">
          <svg class="avatar" viewBox="0 0 120 140" aria-hidden="true">
            <defs>
              <linearGradient id="avbg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0"   stop-color="#f4a98c"/>
                <stop offset=".55" stop-color="#a9c9ec"/>
                <stop offset="1"   stop-color="#c6b3ee"/>
              </linearGradient>
              <linearGradient id="avfg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2b3252"/>
                <stop offset="1" stop-color="#141a2e"/>
              </linearGradient>
              <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
                <rect width="4" height="1.4" y="0" fill="#ffffff" opacity=".07"/>
              </pattern>
            </defs>
            <rect width="120" height="140" fill="url(#avbg)"/>
            <circle cx="92" cy="26" r="38" fill="#ffffff" opacity=".16"/>
            <circle cx="18" cy="118" r="30" fill="#ffffff" opacity=".10"/>
            <circle cx="60" cy="54" r="24" fill="url(#avfg)"/>
            <path d="M14 140 C21 96 43 86 60 86 C77 86 99 96 106 140 Z" fill="url(#avfg)"/>
            <path d="M42 62 Q60 78 78 62" stroke="#0f8a7e" stroke-width="2.4" fill="none" opacity=".6"/>
            <rect width="120" height="140" fill="url(#scan)"/>
          </svg>
          <span class="seal"></span>
        </div>

        <h1 class="name">Maya Chen</h1>
        <p class="role">Creative Technologist</p>
        <p class="company">LUMINA&#160;LABS</p>

        <div class="holo-band"><i></i></div>

        <div class="meta">
          <div class="qr-tile"><svg id="qr" viewBox="0 0 100 100"></svg></div>
          <div class="meta-r">
            <div class="idnum">NVA-2941-067</div>
            <div class="barcode" id="barcode"></div>
            <div class="zone">HALL&nbsp;B&nbsp;·&nbsp;GATE&nbsp;04</div>
          </div>
        </div>

        <div class="shine"></div>
        <div class="edge"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">drag the badge · give it a fling</div>
  <button class="reset" id="reset" type="button" title="re-center badge">↺</button>
</div>
<script src="script.js"></script>
</body>
</html>
