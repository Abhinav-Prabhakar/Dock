# Local dev stack: ui (nginx, both static sites + /api proxy) · api
# (FastAPI backend) · db (Postgres). `docker compose up --build`, then
# open http://localhost:8080 (operator) and http://localhost:8080/customers/.
#
# The api is only reachable through ui's same-origin /api proxy (no host
# port of its own), exactly the way the browser sees it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockpw}
      POSTGRES_DB: ${POSTGRES_DB:-dock}
    volumes:
      - dock_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"   # host access for local pytest/alembic; set DB_PORT if 5432 is taken
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dock} -d ${POSTGRES_DB:-dock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dock}:${POSTGRES_PASSWORD:-dockpw}@db:5432/${POSTGRES_DB:-dock}
      DOCK_SEED: ${DOCK_SEED:-0}
      DOCK_PPO_MODEL: ${DOCK_PPO_MODEL:-}
      DOCK_LEDGER_DIR: /data/ledger
    volumes:
      - dock_ledger:/data/ledger     # hash-chained event ledgers survive rebuilds
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  dock_pgdata:
  dock_ledger:
