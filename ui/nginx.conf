# Dock UI: serves the two static sites and proxies /api/ to the backend
# same-origin, so the frontends never need to know the API's real host or
# port. The api service name below is the compose service ("api").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    # Port-operator console (drafts/cargo-ship) at the root.
    root /usr/share/nginx/html/cargo-ship;
    index index.html;

    # Always revalidate the static sites: without a Cache-Control header
    # browsers heuristically reuse cached JS/CSS after a rebuild, so a fix can
    # look like it never shipped. ETag/Last-Modified keep revalidation cheap
    # (304s), so this costs nothing when files haven't changed.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Customer booking site, still at /customers/ (matches the backend's
    # own StaticFiles mount today, so bookmarked URLs don't change). It's a
    # Next.js static export (trailingSlash: true) — every route works both
    # with and without its trailing slash, and both as a bare path and as
    # its literal .html file (e.g. /customers/dashboard, /customers/dashboard/,
    # /customers/dashboard.html, /customers/dashboard/index.html all resolve).
    # bare /customers -> /customers/ (relative, so it keeps the host:port
    # the browser used, e.g. the 8080 port mapping)
    absolute_redirect off;
    location = /customers { return 301 /customers/; }

    location /customers/ {
        alias /usr/share/nginx/html/customers/;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Backend API, same-origin. /api/orders -> http://api:8000/orders.
    # proxy_pass uses a variable (not a bare hostname) so "api" is resolved
    # at request time via Docker's embedded DNS, not once at nginx startup —
    # otherwise nginx refuses to start at all when this image runs without
    # its "api" container on the same network (e.g. a standalone build
    # check), even though every static route is perfectly servable.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        # With a variable in proxy_pass nginx no longer swaps the matched
        # /api/ prefix for a URI part, so strip it explicitly (query string
        # is kept): /api/orders?x=1 -> http://api:8000/orders?x=1.
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (episode + live event streams).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
