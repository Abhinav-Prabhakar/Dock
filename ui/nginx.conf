# Dock UI: serves the two static sites and proxies /api/ to the backend
# same-origin, so the frontends never need to know the API's real host or
# port. The api service name below is the compose service ("api").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    # Port-operator console (drafts/cargo-ship) at the root.
    root /usr/share/nginx/html/cargo-ship;
    index index.html;

    # Always revalidate the static sites: without a Cache-Control header
    # browsers heuristically reuse cached JS/CSS after a rebuild, so a fix can
    # look like it never shipped. ETag/Last-Modified keep revalidation cheap
    # (304s), so this costs nothing when files haven't changed.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Customer booking site, still at /customers/ (matches the backend's
    # own StaticFiles mount today, so bookmarked URLs don't change).
    location /customers/ {
        alias /usr/share/nginx/html/customers/;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Backend API, same-origin. /api/orders -> http://api:8000/orders.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (episode + live event streams).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
