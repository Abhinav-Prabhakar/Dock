name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dock
          POSTGRES_PASSWORD: dockpw
          POSTGRES_DB: dock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dock -d dock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dock:dockpw@localhost:5432/dock
      DOCK_REQUIRE_DB: "1"   # no Postgres = fail, never skip
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU-only torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Generate reference data
        run: python -m data.generate --seed 42 --scale 1.0 --out data/generated
      - name: pytest
        run: python -m pytest -p no:warnings

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: node --check every site script
        run: |
          find customers drafts/cargo-ship -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          echo "checked $(find customers drafts/cargo-ship -name '*.js' | wc -l) files"
      - name: No hard-coded API origin or local order cache in the customer site
        run: |
          if git grep -n "localhost:8399\|ml\.orders" -- 'customers/*.js' 'customers/*.html'; then
            echo "::error::customer pages must use customers/shared/api.js (same-origin, no local cache)"
            exit 1
          fi

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (db, api, ui)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: scripts/smoke.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
